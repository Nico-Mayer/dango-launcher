name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "openspec/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - uses: swatinem/rust-cache@v2

      - uses: jdx/mise-action@v5
        with:
          install_args: hk

      - name: Check
        run: mise run check

      - name: Test
        run: cargo test

