name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - uses: swatinem/rust-cache@v2

      - uses: jdx/mise-action@v5
        with:
          install_args: hk

      - name: Check
        run: mise run check

      - name: Test
        run: cargo test

