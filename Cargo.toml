[package]
name = "dango"
version = "6.9.0"
description = "Keyboard-first application launcher"
authors = ["nimayer"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Keys are camelCase: cargo-packager reads this table as its JSON config.
[package.metadata.packager]
productName = "Dango"
identifier = "com.nimayer.dango"
icons = ["icons/icon.ico", "icons/icon.icns"]
beforePackagingCommand = "cargo build --release"

[package.metadata.packager.nsis]
installMode = "currentUser"

[package.metadata.packager.macos]
infoPlistPath = "Info.plist"
entitlements = "Entitlements.plist"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dango_lib"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[dependencies]
fend-core = "1.5.9"
global-hotkey = "0.8"
auto-launch = "0.6"
open = "5"
raw-window-handle = "0.6"
# Pinned exactly: the winit accessor and the window handle are unstable API.
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "backend-winit",
  "renderer-femtovg",
  "renderer-software",
  "accessibility",
  "compat-1-2",
  "system-tray",
  "unstable-winit-030",
  "raw-window-handle-06",
  "image-default-formats",
] }
icondata_lu = "0.1"
icondata_core = "0.1"
single-instance = "0.3"
interprocess = "2"
url = "2"
# Finds an agent CLI in a given folder list, PATHEXT included.
which = "8"
# Spawns an agent CLI into a Windows job object or a Unix process group, so
# abandoning a request stops everything the wrapper script started.
process-wrap = { version = "10", default-features = false, features = ["std", "job-object", "creation-flags", "process-group"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v4"] }
thiserror = "2.0.20"
async-trait = "0.1.92"
png = "0.18"
time = { version = "0.3", default-features = false, features = ["formatting", "local-offset", "macros", "std"] }
clipboard-rs = "0.3.5"
siphasher = "1"
dirs = "6"
notify = "8"
enigo = { version = "0.6.1", default-features = false }
minijinja = { version = "2.24", default-features = false, features = ["builtins", "serde", "urlencode"] }
# Pinned exactly: pre-1.0 and moving, and the 0.7 beta line changes shape.
genai = "=0.6.5"
futures = { version = "0.3", default-features = false, features = ["std"] }
# Finds a site's favicon: parses the `<link rel="icon">` tags and falls back to
# /favicon.ico. Resolves onto the same reqwest genai already pulls.
favicon-picker = { version = "1.1.0", features = ["blocking"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
nucleo-matcher = "0.3.1"
bytesize = "2.7.0"
cargo-packager-updater = "0.2.3"
rolling-file = "0.2"
email_address = { version = "0.2.9", default-features = false }
steamlocate = "2.1"
toml_edit = "0.25"
slug = "0.1.6"
ddc = "0.2"
# Shrinks an extension's large image files off the UI thread. Same version
# Slint already pulls in for its own image loading.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
rquickjs = { version = "0.14", features = ["futures", "parallel"] }
rquickjs-extra = { version = "0.3", default-features = false, features = ["timers", "url"] }

[dev-dependencies]
ts-rs = "12"
base64 = "0.22"
i-slint-backend-testing = "=1.18.1"
jsonschema = { version = "0.26", default-features = false }
minisign-verify = "0.2"
tempfile = "3"
tokio = { version = "1.53.1", default-features = false, features = ["test-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Reading the focused element's selection without touching the keyboard. Wraps
# the COM lifetime and initialisation rules that are the actual work here.
uiautomation = "0.25"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Com_Urlmon",
  "Win32_System_DataExchange",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"
ddc-winapi = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
libc = "0.2"
objc2-app-kit = { version = "0.3", features = [
  "NSAnimation",
  "NSAnimationContext",
  "NSWindow",
  "NSEvent",
  "NSScreen",
  "NSPanel",
  "NSResponder",
  "NSApplication",
  "NSWorkspace",
  "NSRunningApplication",
  "NSImage",
  "NSImageRep",
  "NSGraphicsContext",
  "NSBitmapImageRep",
  "NSPasteboard",
  "NSView",
  "NSText",
  "NSTextView",
  "NSScrollView",
  "NSClipView",
  "NSMenu",
  "NSMenuItem",
  "block2",
  "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3", features = [
  "NSAppleEventManager",
  "NSArray",
  "NSFileManager",
  "NSGeometry",
  "NSNotification",
  "NSDate",
  "NSOperation",
  "NSRunLoop",
  "NSString",
  "NSURL",
  "block2",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage"] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "AXError",
  "AXUIElement",
  "AXValue",
  "HIServices",
  "libc",
] }
ddc-macos = "0.2"


# Keeps file and line in backtraces at a fraction of full debug info.
[profile.dev]
debug = "line-tables-only"

# Hand checks run in debug builds, and unoptimised inflate makes image rows
# lag there in a way release builds never do.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "debuginfo"
